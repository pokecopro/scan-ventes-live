<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scan ventes live</title>
<style>
  :root {
    --fond: #10151c; --carte: #1a222d; --trait: #2b3644; --texte: #eef2f6; --doux: #93a1b3;
    --ok: #37c98b; --alerte: #f2b33d; --erreur: #ef6b62; --accent: #4f9cf5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px 32px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  label { display: block; font-size: 13px; color: var(--doux); margin: 12px 0 4px; }
  input, select, button { font: inherit; color: inherit; }
  input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--trait);
    background: var(--carte); }
  button { border-radius: 10px; padding: 12px 14px; background: var(--carte);
    border: 1px solid var(--trait); }
  button.principal { background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 600; width: 100%; margin-top: 18px; padding: 14px; }
  button:disabled { opacity: .5; }
  [hidden] { display: none !important; }
  .entete { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .entete b { font-size: 15px; }
  .compteur { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--doux); text-align: right; }
  .compteur strong { color: var(--texte); font-size: 22px; }
  #lecteur { position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 46vh; margin: 0 auto;
    border-radius: 12px; overflow: hidden; background: #000; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #viseur { position: absolute; left: 15%; top: 15%; width: 70%; height: 70%;
    border: 3px solid rgba(255,255,255,.85); border-radius: 14px; pointer-events: none; }
  #lecteur.flash #viseur { border-color: var(--ok); }
  #lampe { position: absolute; right: 8px; bottom: 8px; padding: 8px 12px; font-size: 13px;
    background: rgba(16,21,28,.75); }
  #etat { border-radius: 12px; padding: 12px 14px; margin: 10px 0; background: var(--carte);
    border-left: 6px solid var(--trait); min-height: 76px; }
  #etat.ok { border-left-color: var(--ok); }
  #etat.alerte { border-left-color: var(--alerte); }
  #etat.erreur { border-left-color: var(--erreur); }
  #etat .t { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
  #etat .s { color: var(--doux); font-size: 14px; overflow-wrap: anywhere; }
  #envoi { font-size: 13px; color: var(--alerte); min-height: 18px; margin: -4px 0 6px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button { font-size: 14px; }
  #saisie { display: flex; gap: 8px; margin-top: 8px; }
  #saisie select { width: 96px; flex: none; }
  #saisie button { flex: none; }
  ul { list-style: none; padding: 0; margin: 14px 0 0; }
  li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--trait); font-size: 14px; }
  li .n { color: var(--doux); width: 30px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  li .c { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li .c small { display: block; color: var(--doux); font-variant-numeric: tabular-nums; }
  li .g { flex: none; font-weight: 600; }
  #plancher { border-radius: 12px; padding: 14px; margin: 10px 0 0; background: var(--carte); text-align: center;
    border: 2px solid var(--trait); }
  #plancher.ok { border-color: var(--ok); }
  #plancher.non { border-color: var(--alerte); }
  .pl-titre { font-size: 13px; color: var(--doux); text-transform: uppercase; letter-spacing: .06em; }
  .pl-prix { font-size: 64px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #plancher.non .pl-prix { font-size: 26px; padding: 14px 0; }
  .pl-carte { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .pl-detail { font-size: 13px; color: var(--doux); margin-top: 6px; overflow-wrap: anywhere; white-space: pre-line; text-align: left; }
  li.envoi { opacity: .6; }
  li.nr .c { color: var(--doux); text-decoration: line-through; }
  li.nr .c small { text-decoration: none; color: var(--alerte); }
  #etapes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  #etapes button { font-size: 14px; padding: 10px 8px; }
  #etape-1.actif { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #etape-2.actif { background: var(--alerte); border-color: var(--alerte); color: #10151c; font-weight: 600; }
  #lecteur.nr #viseur { border-color: var(--alerte); }
  .aide { color: var(--doux); font-size: 13px; margin-top: 8px; overflow-wrap: anywhere; }
  .date3 { display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: 8px; }
  .modes { display: grid; gap: 10px; margin-top: 18px; }
  .mode { text-align: left; padding: 16px; }
  .mode b { display: block; font-size: 17px; }
  .mode span { display: block; color: var(--doux); font-size: 14px; margin-top: 2px; }
  .retour { width: 100%; margin-top: 10px; }
</style>
</head>
<body>

<section id="ecran-menu">
  <h1>Scan cartes gradées</h1>
  <label for="code">Code d'accès</label>
  <input id="code" type="password" inputmode="numeric" autocomplete="off">
  <div class="modes">
    <button class="mode" data-mode="renta"><b>Rentabilité</b><span>Scanner les cartes vendues après un live</span></button>
    <button class="mode" data-mode="listing"><b>Listing</b><span>Scanner les cartes d'un stream et sortir le CSV Whatnot</span></button>
    <button class="mode" data-mode="stock"><b>Inventaire</b><span>Faire entrer des cartes en stock</span></button>
    <button class="mode" data-mode="prix"><b>Prix plancher</b><span>Scanner une carte pour savoir à partir de quel prix on gagne de l'argent</span></button>
  </div>
  <p class="aide" id="msg-menu"></p>
</section>

<section id="ecran-depart" hidden>
  <h1 id="titre-depart"></h1>
  <div id="champs-live">
    <label for="chaine">Chaîne</label>
    <select id="chaine">
      <option>MAIN</option><option>BIS</option><option>OSMO</option><option>PROTECH</option>
    </select>
    <label for="jour" id="lib-date">Date du live</label>
    <div class="date3">
      <select id="jour" aria-label="Jour"></select>
      <select id="mois" aria-label="Mois"></select>
      <select id="annee" aria-label="Année"></select>
    </div>
    <input id="date" type="hidden">
  </div>
  <label for="precision" id="lib-precision">Précision (facultatif, ex. 17h ou GRADEE JAP)</label>
  <input id="precision" type="text" autocomplete="off">
  <button class="principal" id="commencer">Commencer à scanner</button>
  <button class="retour" id="retour-menu">Retour</button>
  <p class="aide" id="msg-depart"></p>
</section>

<section id="ecran-scan" hidden>
  <div class="entete">
    <b id="nom-live"></b>
    <span class="compteur"><strong id="total">0</strong> <span id="unite">carte(s)</span></span>
  </div>
  <div id="etapes" hidden>
    <button id="etape-1" class="actif">1 · Toutes les cartes</button>
    <button id="etape-2">2 · Non régulés</button>
  </div>
  <div id="lecteur">
    <video id="video" playsinline muted autoplay></video>
    <div id="viseur"></div>
    <button id="lampe" hidden>Lampe</button>
  </div>
  <div id="plancher" hidden>
    <div class="pl-titre" id="pl-titre">Prix plancher</div>
    <div class="pl-prix" id="pl-prix">–</div>
    <div class="pl-carte" id="pl-carte"></div>
    <div class="pl-detail" id="pl-detail"></div>
  </div>
  <div id="etat"><div class="t">Vise le QR code d'un boîtier</div><div class="s">La carte s'enregistre toute seule.</div></div>
  <div id="envoi"></div>
  <div class="actions">
    <button id="btn-photo">Prendre une photo</button>
    <button id="btn-saisie">Taper le numéro</button>
    <button id="btn-annuler">Annuler le dernier</button>
    <button id="btn-changer">Terminer</button>
  </div>
  <button class="principal" id="btn-csv" hidden>Télécharger le CSV Whatnot</button>
  <p class="aide" id="msg-csv"></p>
  <input id="fichier" type="file" accept="image/*" capture="environment" hidden>
  <div id="saisie" hidden>
    <select id="saisie-grad"><option value="CA">CA</option><option value="PCA">PCA</option></select>
    <input id="saisie-num" type="text" inputmode="numeric" placeholder="N° de certificat">
    <button id="saisie-ok">OK</button>
  </div>
  <ul id="liste"></ul>
</section>

<script src="jsQR.js"></script>
<script src="zbar.js"></script>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbxbnc8tY2wrOsmH5IAmXWQvmsiZNlMN0fhgiwbUZ52pnTXY4gOPIdgNjgGz5NpR6U15/exec';

  var $ = function (id) { return document.getElementById(id); };
  var session = { code: '', live: '', mode: 'renta' };
  var PRIX_CADRE = 15;   // € HT, ajouté quand le code-barres d'un cadre est vu avec le QR code
  var fenetre = null;    // carte qui vient d'être lue : pendant un court instant on cherche le code-barres d'un cadre
  var modeNR = false;    // vrai quand on scanne les ventes non réglées
  var compteur = 0;      // nombre renvoyé par le Sheet (cartes de la session, ou cartes en stock)
  var MODES = {
    renta: { titre: 'Rentabilité', unite: 'vendue(s)', date: 'Date du live' },
    listing: { titre: 'Listing', unite: 'listée(s)', date: 'Date du stream' },
    stock: { titre: 'Inventaire', unite: 'en stock', date: '' },
    prix: { titre: 'Prix plancher', unite: '', date: '' }
  };
  var lignes = [];       // cartes du live, la plus récente en premier
  var vus = {};          // "Gradateur certificat" déjà scanné sur ce live
  var file = [];         // scans pas encore enregistrés dans le Sheet, dans l'ordre
  var enCours = false;
  var dernierTexte = '', dernierInstant = 0;
  var flux = null, piste = null, lampeAllumee = false, verrouEcran = null;
  var toile = document.createElement('canvas');
  var TAILLES = [480, 640, 400, 800], tour = 0;
  var detecteur = null;
  try { if ('BarcodeDetector' in window) detecteur = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}

  function lire(cle) { try { return localStorage.getItem(cle) || ''; } catch (e) { return ''; } }
  function ecrire(cle, v) { try { localStorage.setItem(cle, v); } catch (e) {} }

  // ---- appel au script Google ----
  function appeler(fonction, donnees) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fonction, req: Object.assign(
        { code: session.code, live: session.live, mode: session.mode }, donnees || {}) }),
      redirect: 'follow'
    }).then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
  }

  // ---- retours sonores et visuels ----
  var audio = null;
  function bip(freq, duree) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + duree);
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(freq > 600 ? 60 : [80, 60, 80]); } catch (e) {}
  }
  function etat(type, titre, sous) {
    if (session.mode === 'prix') { afficherPlancher('non', titre, '', sous || ''); return; }
    var e = $('etat');
    e.className = type;
    e.innerHTML = '';
    var t = document.createElement('div'); t.className = 't'; t.textContent = titre;
    var s = document.createElement('div'); s.className = 's'; s.textContent = sous || '';
    e.appendChild(t); e.appendChild(s);
  }
  function prefixe(gradateur) { return gradateur === 'CollectAura' ? 'CA' : 'PCA'; }

  function afficherListe() {
    var liste = $('liste');
    liste.innerHTML = '';
    lignes.forEach(function (l) {
      var li = document.createElement('li');
      li.className = (l.envoi ? 'envoi' : '') + (l.nr ? ' nr' : '');
      var n = document.createElement('span'); n.className = 'n'; n.textContent = l.num || '…';
      var c = document.createElement('span'); c.className = 'c';
      c.textContent = l.carte ? (l.carte + ' ' + (l.numero || '')).trim() : 'Carte à compléter';
      var p = document.createElement('small'); p.textContent = 'Certificat ' + l.cert + (l.cadre ? ' · cadre' : '') + (l.nr ? ' · non régulé' : '');
      c.appendChild(p);
      var g = document.createElement('span'); g.className = 'g';
      g.textContent = prefixe(l.gradateur) + (l.note ? ' ' + l.note : '');
      li.appendChild(n); li.appendChild(c); li.appendChild(g);
      liste.appendChild(li);
    });
    var attente = file.length;
    $('total').textContent = compteur + file.filter(function (s) { return !s.nr && !s.retablir && !s.ajoutCadre; }).length;
    if (session.mode === 'renta') {
      var nbNR = lignes.filter(function (l) { return l.nr; }).length;
      $('unite').textContent = MODES.renta.unite + (nbNR ? ' · ' + nbNR + ' non régulé(s)' : '');
    }
    $('envoi').textContent = attente ? attente + ' carte(s) en cours d\'enregistrement…' : '';
  }

  // ---- reconnaissance du QR code ----
  function analyser(texte) {
    var m = String(texte).match(/collectaura\.com.*[?&]serialnumber=(\d+)/i);
    if (m) return { gradateur: 'CollectAura', cert: m[1] };
    m = String(texte).match(/pcagrade\.com\/verif\/(\d+)/i);
    if (m) return { gradateur: 'PCA', cert: m[1] };
    m = String(texte).match(/^(CA|PCA)\s*(\d{5,})$/i);
    if (m) return { gradateur: m[1].toUpperCase() === 'CA' ? 'CollectAura' : 'PCA', cert: m[2] };
    return null;
  }

  // cadreConnu : indéfini quand le scan vient de la caméra (on cherchera le code-barres juste après),
  // sinon la référence du cadre lue sur la photo, ou '' s'il n'y en a pas.
  function recu(texte, cadreConnu) {
    var maintenant = Date.now();
    // tant que le même QR reste devant la caméra, on ne le signale pas à nouveau
    if (texte === dernierTexte && maintenant - dernierInstant < 2500) { dernierInstant = maintenant; return; }
    dernierTexte = texte; dernierInstant = maintenant;
    if (fenetre) fermerFenetre('');   // une autre carte arrive : la recherche de cadre de la précédente s'arrête
    var a = analyser(texte);
    if (!a) {
      bip(300, 0.25);
      etat('erreur', 'QR code non reconnu', 'Ce n\'est ni un boîtier PCA ni un CollectAura.');
      return;
    }
    if (session.mode === 'prix') {
      // mode Prix plancher : rien n'est enregistré, on affiche seulement le prix de vente minimum
      bip(900, 0.08);
      $('lecteur').classList.add('flash');
      setTimeout(function () { $('lecteur').classList.remove('flash'); }, 250);
      afficherPlancher('', 'Recherche…', a.gradateur + ' n° ' + a.cert, '');
      if (cadreConnu === undefined && flux) fenetre = { texte: texte, prix: true, fin: maintenant + 1200 };
      else demanderPrix(texte, cadreConnu || '');
      return;
    }
    var cle = a.gradateur + ' ' + a.cert;
    var deja = lignes.filter(function (l) { return l.cle === cle; })[0];
    if (modeNR) {
      // vente non réglée : la carte sort des ventes du live et retourne en stock
      bip(600, 0.1);
      etat('', a.gradateur + ' n° ' + a.cert, 'Passage en non régulé…');
      file.push({ texte: texte, cle: cle, cert: a.cert, nr: true, pret: true });
      afficherListe(); vider();
      return;
    }
    if (deja && deja.nr) {
      // carte non régulée rescannée comme vendue : la vente a finalement été payée
      bip(900, 0.08);
      etat('', a.gradateur + ' n° ' + a.cert, 'Remise en vendue…');
      file.push({ texte: texte, ligne: deja, retablir: true, pret: true });
      afficherListe(); vider();
      return;
    }
    if (vus[cle]) {
      // déjà scannée sans cadre : si le code-barres du cadre est visible, on ajoute seulement le cadre
      if (deja && !deja.cadre && !deja.envoi) {
        if (cadreConnu) { file.push({ texte: texte, ligne: deja, cadre: cadreConnu, ajoutCadre: true, pret: true }); vider(); return; }
        if (cadreConnu === undefined && flux) fenetre = { texte: texte, ligne: deja, fin: maintenant + 1500 };
      }
      bip(300, 0.25);
      etat('alerte', 'Déjà scannée' + (deja && deja.num ? ' (n° ' + deja.num + ')' : ''),
        (deja && deja.carte ? deja.carte + ' · ' : '') + 'certificat ' + a.cert);
      return;
    }
    vus[cle] = true;
    bip(900, 0.08);
    $('lecteur').classList.add('flash');
    setTimeout(function () { $('lecteur').classList.remove('flash'); }, 250);

    var ligne = { cle: cle, gradateur: a.gradateur, cert: a.cert, carte: '', numero: '', note: '', envoi: true, num: 0 };
    var scan = { texte: texte, ligne: ligne, info: null, pret: false };
    lignes.unshift(ligne);
    file.push(scan);
    afficherListe();

    if (a.gradateur === 'PCA') {
      etat('alerte', 'PCA n° ' + a.cert, 'Certificat enregistré. Carte à compléter quand PCA ouvrira son API.');
      finaliser(scan, cadreConnu);
      return;
    }
    etat('', 'CollectAura n° ' + a.cert, 'Recherche de la carte…');
    finaliser(scan, cadreConnu);
  }

  // Avant d'envoyer la carte, on laisse un court instant à la caméra pour voir le code-barres d'un cadre.
  function finaliser(scan, cadreConnu) {
    if (cadreConnu === undefined && flux) {
      fenetre = { texte: scan.texte, scan: scan, fin: Date.now() + 1200 };
      return;
    }
    scan.cadre = cadreConnu || '';
    if (scan.cadre) scan.ligne.cadre = true;
    scan.pret = true; afficherListe(); vider();
  }
  function fermerFenetre(ref) {
    var f = fenetre; fenetre = null;
    if (!f) return;
    if (ref) bip(1200, 0.08);
    if (f.prix) { demanderPrix(f.texte, ref); return; }
    if (f.scan) {
      f.scan.cadre = ref;
      if (ref) f.scan.ligne.cadre = true;
      f.scan.pret = true;
    } else if (ref && f.ligne && !f.ligne.cadre) {
      file.push({ texte: f.texte, ligne: f.ligne, cadre: ref, ajoutCadre: true, pret: true });
    }
    afficherListe(); vider();
  }
  // ---- Prix plancher ----
  function afficherPlancher(type, prix, carte, detail) {
    $('plancher').className = type;
    $('pl-prix').textContent = prix;
    $('pl-carte').textContent = carte;
    $('pl-detail').textContent = detail;
  }
  function euros(v) { return String(v.toFixed(2)).replace('.', ',') + ' €'; }
  var demandePrix = 0;
  function demanderPrix(texte, cadre) {
    var moi = ++demandePrix;
    appeler('prixPlancher', { texte: texte, cadre: cadre }).then(function (r) {
      if (moi !== demandePrix) return;   // une autre carte a été scannée entre-temps
      var carte = r.carte ? (r.carte + ' ' + (r.numero || '')).trim() + (r.note ? ' · CA ' + r.note : '') : '';
      if (r.ok) {
        var lignes = r.sites.map(function (s) { return s.site + ' : ' + s.yen + ' ¥'; });
        lignes.push('Prix d\'achat retenu : ' + r.yen + ' ¥, soit ' + euros(r.achat) + ' HT');
        lignes.push('Gradation : ' + euros(r.gradation) + (r.cadre ? ' · Cadre : ' + euros(r.cadre) : ''));
        lignes.push('Coût total : ' + euros(r.cout) + ' HT · seuil exact : ' + euros(r.seuil));
        (r.notes || []).forEach(function (n) { lignes.push(n); });
        afficherPlancher('ok', r.plancher + ' €', carte, lignes.join('\n'));
        return;
      }
      bip(300, 0.25);
      var raisons = {
        pca: ['Carte PCA', 'Le nom de la carte n\'est pas connu tant que PCA n\'a pas ouvert son API.'],
        langue: ['Carte française', 'Les sites de prix ne vendent que des cartes japonaises.'],
        introuvable: ['Carte introuvable', 'CollectAura ne connaît pas ce certificat.'],
        taux: ['Taux de change indisponible', 'Réessaie dans un instant.'],
        inconnu: ['QR code non reconnu', ''],
        prix: ['Prix d\'achat introuvable', (r.notes || []).join('\n')]
      };
      var x = raisons[r.raison] || ['Pas de prix', ''];
      afficherPlancher('non', x[0], carte || ('Certificat ' + (r.cert || '')), x[1]);
    }).catch(function (e) {
      if (moi !== demandePrix) return;
      var msg = String(e && e.message || e);
      afficherPlancher('non', msg.indexOf('CODE_INVALIDE') >= 0 ? 'Code d\'accès incorrect' : 'Recherche impossible',
        '', msg.indexOf('CODE_INVALIDE') >= 0 ? 'Touche « Terminer » et retape le code.' : msg);
    });
  }

  var barresOccupe = false;
  function chercherCadre(v) {
    if (!fenetre || barresOccupe) return;
    var f = fenetre;
    barresOccupe = true;
    lireCodeBarres(v, v.videoWidth, v.videoHeight).then(function (ref) {
      barresOccupe = false;
      if (fenetre !== f) return;
      if (ref) fermerFenetre(ref);
      else if (Date.now() > f.fin) fermerFenetre('');
    });
  }

  // ---- code-barres classique (Code 128) de l'étiquette d'un cadre : « PRO-PCOL-00836 » ----
  var toileBarres = document.createElement('canvas');
  function lireCodeBarres(source, sw, sh) {
    if (typeof zbarWasm === 'undefined') return Promise.resolve('');
    try {
      var k = Math.min(1, 1100 / Math.max(sw, sh));
      toileBarres.width = Math.round(sw * k); toileBarres.height = Math.round(sh * k);
      var ctx = toileBarres.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(source, 0, 0, sw, sh, 0, 0, toileBarres.width, toileBarres.height);
      return zbarWasm.scanImageData(ctx.getImageData(0, 0, toileBarres.width, toileBarres.height))
        .then(function (codes) {
          for (var i = 0; i < codes.length; i++) {
            var t = codes[i].decode();
            if (/^PRO-[A-Z0-9]+-\d+$/i.test(t)) return t.toUpperCase();
          }
          return '';
        }).catch(function () { return ''; });
    } catch (e) { return Promise.resolve(''); }
  }

  // ---- enregistrement dans le Sheet, par paquets, dans l'ordre des scans ----
  function vider() {
    if (enCours) return;
    var lot = [];
    var nr = !!(file[0] && file[0].nr);   // un paquet ne mélange pas ventes et non régulés
    while (lot.length < 20 && file[lot.length] && file[lot.length].pret && !!file[lot.length].nr === nr) lot.push(file[lot.length]);
    if (!lot.length) return;
    enCours = true;
    appeler('enregistrerLot', {
      nonRegle: nr,
      scans: lot.map(function (s) { return { texte: s.texte, cadre: s.cadre || '' }; })
    }).then(function (rep) {
      var res = rep.resultats || [];
      compteur = rep.compteur;
      file.splice(0, lot.length);
      lot.forEach(function (s, i) {
        var r = res[i] || {}, l = s.ligne;
        if (s.nr) {
          var cible = lignes.filter(function (x) { return x.cle === s.cle; })[0];
          if (r.ok) {
            if (cible) cible.nr = true;
            etat('ok', 'Non régulé : ' + (r.carte ? (r.carte + ' ' + (r.numero || '')).trim() : 'certificat ' + s.cert),
              'Retirée des ventes du live (n° ' + r.num + ') et remise en stock.');
          } else if (r.raison === 'dejaNonRegle') {
            bip(300, 0.25);
            etat('alerte', 'Déjà en non régulé', (r.carte ? r.carte + ' · ' : '') + 'certificat ' + s.cert);
          } else if (r.raison === 'absent') {
            bip(300, 0.25);
            etat('erreur', 'Cette carte n\'est pas dans ce live',
              r.ailleurs ? 'Elle a été scannée sur ' + r.ailleurs + '.' : 'Certificat ' + s.cert + ' : jamais scanné comme vendu ici.');
          } else {
            etat('erreur', 'QR code non reconnu', '');
          }
          return;
        }
        if (s.ajoutCadre) {
          if (r.cadreAjoute) {
            l.cadre = true;
            etat('ok', 'Cadre ajouté : + ' + PRIX_CADRE + ' € HT', (l.carte ? l.carte + ' · ' : '') + 'certificat ' + l.cert);
          }
          return;
        }
        if (r.ok && r.retabli) {
          l.nr = false;
          etat('ok', 'Remise en vendue', (l.carte ? l.carte + ' · ' : '') + 'certificat ' + l.cert);
          return;
        }
        if (s.retablir) return;
        if (r.ok) {
          l.envoi = false; l.num = r.num; l.cadre = !!r.cadre;
          if (!l.carte && r.carte) { l.carte = r.carte; l.numero = r.numero; l.note = r.note; }
          if (lignes[0] === l) {
            if (r.ailleurs) etat('alerte', l.carte || (l.gradateur + ' n° ' + l.cert), 'Déjà scannée sur ' + r.ailleurs);
            else if (r.trouve && l.gradateur === 'CollectAura') etat('ok', (l.carte + ' ' + l.numero).trim(),
              'CA ' + l.note + (r.extension ? ' · ' + r.extension : '') + ' · certificat ' + l.cert +
              (l.cadre ? ' · cadre + ' + PRIX_CADRE + ' € HT' : ''));
            else if (!r.trouve && l.gradateur === 'CollectAura') etat('alerte', 'CollectAura n° ' + l.cert, r.statut);
          }
        } else {
          lignes = lignes.filter(function (x) { return x !== l; });
          if (r.raison === 'doublon') {
            bip(300, 0.25);
            etat('alerte', r.etat ? 'Déjà ' + r.etat : 'Déjà scannée (n° ' + r.num + ')',
              (r.carte ? r.carte + ' · ' : '') + 'certificat ' + l.cert);
          } else {
            delete vus[l.cle];
            etat('erreur', 'QR code non reconnu', '');
          }
        }
      });
      enCours = false;
      afficherListe();
      vider();
    }).catch(function (e) {
      enCours = false;
      var msg = String(e && e.message || e);
      if (msg.indexOf('CODE_INVALIDE') >= 0) {
        etat('erreur', 'Code d\'accès incorrect', 'Rien n\'est enregistré. Touche « Terminer » et retape le code.');
        return;
      }
      $('envoi').textContent = file.length + ' carte(s) pas encore enregistrée(s), nouvel essai… (' + msg + ')';
      setTimeout(vider, 4000);
    });
  }

  window.addEventListener('beforeunload', function (e) {
    if (file.length) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---- lecture d'une image : zone centrale d'abord, puis zones agrandies ----
  function decoderImageData(img) {
    var r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    return r && r.data ? r.data : null;
  }
  function decoderZone(source, sx, sy, sw, sh, cible) {
    var k = cible / Math.max(sw, sh);
    toile.width = Math.max(1, Math.round(sw * k)); toile.height = Math.max(1, Math.round(sh * k));
    var ctx = toile.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(source, sx, sy, sw, sh, 0, 0, toile.width, toile.height);
    return decoderImageData(ctx.getImageData(0, 0, toile.width, toile.height));
  }

  // ---- caméra en direct ----
  function boucle() {
    if (!flux) return;
    var v = $('video');
    var suite = function () { if (flux) setTimeout(boucle, 40); };
    if (v.readyState < 2 || !v.videoWidth) { suite(); return; }
    var c = Math.floor(Math.min(v.videoWidth, v.videoHeight) * 0.7);
    var sx = Math.floor((v.videoWidth - c) / 2), sy = Math.floor((v.videoHeight - c) / 2);
    if (detecteur) {
      toile.width = toile.height = Math.min(c, 900);
      toile.getContext('2d').drawImage(v, sx, sy, c, c, 0, 0, toile.width, toile.height);
      detecteur.detect(toile).then(function (codes) {
        if (codes && codes[0] && codes[0].rawValue) recu(codes[0].rawValue);
        chercherCadre(v);
      }).catch(function () { detecteur = null; }).then(suite);
      return;
    }
    // La taille d'analyse change à chaque image : selon la distance, le QR se lit mieux à une taille ou une autre.
    var texte = null;
    tour = (tour + 1) % TAILLES.length;
    try { texte = decoderZone(v, sx, sy, c, c, TAILLES[tour]); } catch (e) {}
    if (texte) recu(texte);
    chercherCadre(v);
    suite();
  }

  function demarrerCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraIndisponible('navigateur sans accès caméra');
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).then(function (s) {
      flux = s; piste = s.getVideoTracks()[0];
      var v = $('video');
      v.srcObject = s;
      var p = v.play(); if (p && p.catch) p.catch(function () {});
      try {
        var caps = piste.getCapabilities ? piste.getCapabilities() : {};
        $('lampe').hidden = !caps.torch;
        if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) {
          piste.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
        }
      } catch (e) {}
      try {
        if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { verrouEcran = w; }).catch(function () {});
      } catch (e) {}
      boucle();
    }).catch(function (e) { cameraIndisponible(String(e && (e.name || e.message) || e)); });
  }
  function cameraIndisponible(detail) {
    flux = null;
    $('lecteur').hidden = true;
    etat('alerte', 'Caméra en direct indisponible', 'Utilise « Prendre une photo ». Détail : ' + detail);
  }
  function arreterCamera() {
    if (flux) flux.getTracks().forEach(function (t) { t.stop(); });
    if (fenetre) fermerFenetre('');
    flux = null; piste = null; lampeAllumee = false;
    try { if (verrouEcran) verrouEcran.release(); } catch (e) {}
    verrouEcran = null;
  }
  $('lampe').onclick = function () {
    if (!piste) return;
    lampeAllumee = !lampeAllumee;
    piste.applyConstraints({ advanced: [{ torch: lampeAllumee }] }).catch(function () {});
    this.textContent = lampeAllumee ? 'Lampe allumée' : 'Lampe';
  };

  // ---- lecture d'une photo ----
  function lirePhoto(fichier) {
    return new Promise(function (ok, ko) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var zones = [[0, 0, 1, 1]];
        [2, 3].forEach(function (n) {
          var pas = 1 / (n + 1), taille = 2 * pas;
          for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) zones.push([x * pas, y * pas, taille, taille]);
        });
        for (var i = 0; i < zones.length; i++) {
          var z = zones[i], texte = null;
          for (var t = 0; t < 3 && !texte; t++) {
            try { texte = decoderZone(img, w * z[0], h * z[1], w * z[2], h * z[3], [1400, 800, 500][t]); } catch (e) {}
          }
          if (texte) { lireCodeBarres(img, w, h).then(function (cadre) { ok({ texte: texte, cadre: cadre }); }); return; }
        }
        ko(new Error('aucun QR'));
      };
      img.onerror = ko;
      img.src = URL.createObjectURL(fichier);
    });
  }

  // ---- départ ----
  $('code').value = lire('svl-code');
  if (lire('svl-chaine')) $('chaine').value = lire('svl-chaine');
  (function () {
    var d = new Date(); d.setHours(d.getHours() - 6); // après minuit, on reste sur le live de la veille
    $('date').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  })();

  function chargerLive() {
    return appeler('charger').then(function (r) {
      vus = {}; lignes = []; dernierTexte = '';
      compteur = r.compteur;
      r.lignes.forEach(function (x) {
        var cle = x.gradateur + ' ' + x.cert;
        // en stock, c'est le Sheet qui répond « déjà en stock » ou « déjà vendue sur … »
        if (session.mode !== 'stock') vus[cle] = true;
        lignes.unshift({ cle: cle, gradateur: x.gradateur, cert: x.cert, carte: x.carte, numero: x.numero,
          note: x.note, envoi: false, num: x.num, nr: !!x.nr, cadre: !!x.cadre });
      });
      afficherListe();
    });
  }

  function aujourdhui() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  // ---- date en trois menus : jour / mois / année ----
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre',
    'octobre', 'novembre', 'décembre'];
  function remplir(menu, valeurs, libelles, choisi) {
    menu.innerHTML = '';
    valeurs.forEach(function (v, i) {
      var o = document.createElement('option');
      o.value = v; o.textContent = libelles ? libelles[i] : v;
      menu.appendChild(o);
    });
    // si la valeur voulue n'est pas proposée, on prend la plus proche possible (la dernière)
    menu.value = valeurs.indexOf(choisi) >= 0 ? choisi : (choisi < valeurs[0] ? valeurs[0] : valeurs[valeurs.length - 1]);
  }
  function suite(n) { var t = []; for (var i = 1; i <= n; i++) t.push(i); return t; }
  function majDate(a, m, j) {
    var limite = (session.mode === 'renta');
    var t = new Date(), ta = t.getFullYear(), tm = t.getMonth() + 1, tj = t.getDate();
    remplir($('annee'), limite ? [ta - 1, ta] : [ta - 1, ta, ta + 1], null, a);
    a = +$('annee').value;
    var mois = suite(limite && a === ta ? tm : 12);
    remplir($('mois'), mois, mois.map(function (i) { return MOIS[i - 1]; }), m);
    m = +$('mois').value;
    var nb = new Date(a, m, 0).getDate();
    if (limite && a === ta && m === tm) nb = Math.min(nb, tj);
    remplir($('jour'), suite(nb), null, j);
    j = +$('jour').value;
    $('date').value = a + '-' + ('0' + m).slice(-2) + '-' + ('0' + j).slice(-2);
  }
  ['jour', 'mois', 'annee'].forEach(function (id) {
    $(id).onchange = function () { majDate(+$('annee').value, +$('mois').value, +$('jour').value); };
  });

  // ---- menu des trois modes ----
  Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
    b.onclick = function () {
      var code = $('code').value.trim();
      if (!code) { $('msg-menu').textContent = 'Tape d\'abord le code d\'accès.'; return; }
      var m = b.dataset.mode;
      session.code = code; session.mode = m;
      if (m === 'prix') { ouvrirPrix(); return; }
      $('msg-menu').textContent = '';
      $('titre-depart').textContent = MODES[m].titre;
      $('champs-live').hidden = (m === 'stock');
      $('lib-date').textContent = MODES[m].date;
      // Rentabilité : seulement un live passé ou en cours, les dates à venir ne sont pas proposées
      var v = $('date').value.split('-');
      majDate(+v[0], +v[1], +v[2]);
      $('lib-precision').textContent = m === 'stock'
        ? 'Lot (facultatif, ex. Retour PCA boîte 12)'
        : 'Précision (facultatif, ex. 17h ou GRADEE JAP)';
      $('precision').value = '';
      $('msg-depart').textContent = '';
      $('ecran-menu').hidden = true; $('ecran-depart').hidden = false;
    };
  });
  $('retour-menu').onclick = function () { $('ecran-depart').hidden = true; $('ecran-menu').hidden = false; };

  $('commencer').onclick = function () {
    var m = session.mode, date = $('date').value, precision = $('precision').value.trim(), live;
    if (m === 'stock') {
      live = 'STOCK' + (precision ? ' ' + precision : '');
    } else {
      if (!date) { $('msg-depart').textContent = 'Il manque la date.'; return; }
      if (m === 'renta' && date > aujourdhui()) {
        $('msg-depart').textContent = 'Ce live n\'a pas encore eu lieu. En Rentabilité, choisis un live passé ou en cours.';
        return;
      }
      var p = date.split('-');
      live = $('chaine').value + ' ' + p[2] + '/' + p[1] + '/' + p[0] + (precision ? ' ' + precision : '');
    }
    $('commencer').disabled = true;
    $('msg-depart').textContent = 'Connexion…';
    session.live = live;
    chargerLive().then(function () {
      ecrire('svl-code', session.code); ecrire('svl-chaine', $('chaine').value);
      $('total').parentNode.hidden = false; $('plancher').hidden = true;
      ['etat', 'envoi', 'btn-annuler', 'liste'].forEach(function (id) { $(id).hidden = false; });
      $('nom-live').textContent = MODES[m].titre + ' · ' + (m === 'stock' ? (precision || 'stock') : live);
      $('unite').textContent = MODES[m].unite;
      $('btn-csv').hidden = (m !== 'listing'); $('msg-csv').textContent = '';
      $('etapes').hidden = (m !== 'renta'); basculerNR(false);
      $('ecran-depart').hidden = true; $('ecran-scan').hidden = false;
      $('lecteur').hidden = false;
      etat('', 'Vise le QR code d\'un boîtier', 'La carte s\'enregistre toute seule.');
      demarrerCamera();
    }).catch(function (e) {
      var msg = String(e && e.message || e);
      $('msg-depart').textContent = msg.indexOf('CODE_INVALIDE') >= 0 ? 'Code d\'accès incorrect. Reviens au menu pour le corriger.' : msg;
    }).then(function () { $('commencer').disabled = false; });
  };

  function ouvrirPrix() {
    session.live = 'PRIX'; lignes = []; file = []; vus = {}; compteur = 0; dernierTexte = '';
    ecrire('svl-code', session.code);
    $('msg-menu').textContent = '';
    $('nom-live').textContent = 'Prix plancher';
    $('total').parentNode.hidden = true;
    ['etapes', 'etat', 'envoi', 'btn-annuler', 'btn-csv', 'liste'].forEach(function (id) { $(id).hidden = true; });
    $('msg-csv').textContent = '';
    $('plancher').hidden = false;
    afficherPlancher('', '–', 'Vise le QR code d\'une carte', 'Le prix de vente minimum sur Whatnot s\'affiche ici, en euros entiers.');
    $('ecran-menu').hidden = true; $('ecran-scan').hidden = false; $('lecteur').hidden = false;
    basculerNR(false);
    demarrerCamera();
  }

  // ---- Rentabilité : ventes non réglées ----
  function basculerNR(actif) {
    modeNR = actif; dernierTexte = '';
    $('etape-1').classList.toggle('actif', !actif);
    $('etape-2').classList.toggle('actif', actif);
    $('lecteur').classList.toggle('nr', actif);
  }
  $('etape-1').onclick = function () {
    basculerNR(false);
    etat('', 'Étape 1 : scanne toutes les cartes du live', 'Chaque carte scannée est comptée comme vendue.');
  };
  $('etape-2').onclick = function () {
    basculerNR(true);
    etat('alerte', 'Étape 2 : rescanne les non régulés',
      'Ce sont les cartes qui restent une fois les colis finis. Elles sortent du calcul et retournent en stock.');
  };

  // ---- Listing : fichier d'import Whatnot ----
  $('btn-csv').onclick = function () {
    var b = this;
    if (file.length) { $('msg-csv').textContent = 'Attends la fin de l\'enregistrement.'; return; }
    b.disabled = true; $('msg-csv').textContent = 'Préparation du fichier…';
    appeler('csvListing').then(function (r) {
      var bilan = r.incluses + ' carte(s) dans le fichier sur ' + r.scannees + ' scannée(s).';
      if (r.sansNom) bilan += ' ' + r.sansNom + ' carte(s) sans nom non incluse(s) (PCA en attente de l\'API).';
      if (r.sansImage.length) bilan += ' Sans image dans INVENTAIRE : ' + r.sansImage.join(' ; ') + '.';
      if (r.erreurInventaire) bilan += ' INVENTAIRE illisible (' + r.erreurInventaire + ') : aucune image.';
      $('msg-csv').textContent = bilan;
      if (!r.incluses) return;
      var blob = new Blob([r.csv], { type: 'text/csv;charset=utf-8' });
      var fichier = null;
      try { fichier = new File([blob], r.nom, { type: 'text/csv' }); } catch (e) {}
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (mobile && fichier && navigator.canShare && navigator.canShare({ files: [fichier] })) {
        return navigator.share({ files: [fichier], title: r.nom }).catch(function () {});
      }
      var lien = document.createElement('a');
      lien.href = URL.createObjectURL(blob); lien.download = r.nom;
      document.body.appendChild(lien); lien.click(); lien.remove();
    }).catch(function (e) { $('msg-csv').textContent = 'Fichier impossible : ' + String(e && e.message || e); })
      .then(function () { b.disabled = false; });
  };

  $('btn-changer').onclick = function () {
    if (file.length) { etat('alerte', 'Attends la fin de l\'enregistrement', file.length + ' carte(s) en cours.'); return; }
    arreterCamera();
    $('ecran-scan').hidden = true; $('ecran-menu').hidden = false;
  };

  $('btn-photo').onclick = function () { $('fichier').click(); };
  $('fichier').onchange = function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    etat('', 'Lecture de la photo…', '');
    lirePhoto(f).then(function (r) { dernierTexte = ''; recu(r.texte, r.cadre); })
      .catch(function () {
        bip(300, 0.25);
        etat('erreur', 'Aucun QR code lisible sur la photo', 'Rapproche-toi du QR code et évite les reflets.');
      });
  };

  $('btn-saisie').onclick = function () { $('saisie').hidden = !$('saisie').hidden; };
  $('saisie-ok').onclick = function () {
    var num = $('saisie-num').value.replace(/\D/g, '');
    if (num.length < 5) return;
    dernierTexte = '';
    recu($('saisie-grad').value + ' ' + num, '');
    $('saisie-num').value = '';
  };

  $('btn-annuler').onclick = function () {
    var b = this;
    if (file.length) { etat('alerte', 'Attends la fin de l\'enregistrement', file.length + ' carte(s) en cours.'); return; }
    if (b.dataset.confirme !== '1') {
      b.dataset.confirme = '1'; b.textContent = 'Confirmer l\'annulation';
      setTimeout(function () { b.dataset.confirme = ''; b.textContent = 'Annuler le dernier'; }, 4000);
      return;
    }
    b.dataset.confirme = ''; b.textContent = 'Annuler le dernier'; b.disabled = true;
    appeler('annulerDernier').then(function (r) {
      if (!r.ok) { etat('alerte', 'Rien à annuler', ''); return; }
      dernierTexte = '';
      return chargerLive().then(function () { etat('', 'Dernier scan supprimé', 'Certificat ' + r.cert); });
    }).catch(function (e) { etat('erreur', 'Annulation impossible', String(e && e.message || e)); })
      .then(function () { b.disabled = false; });
  };
})();
</script>
</body>
